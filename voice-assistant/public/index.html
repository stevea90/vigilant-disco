<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis — Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: #0d0d0d; color: #ccc;
      max-width: 480px; margin: 60px auto; padding: 0 20px;
    }
    h1 { color: #8b5cf6; font-size: 20px; margin-bottom: 4px; }
    p  { color: #555; font-size: 13px; margin-bottom: 32px; }
    .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
    .label { color: #666; }
    .value { color: #e2e2e2; }
    .ok    { color: #22c55e; }
    .busy  { color: #f59e0b; }
    textarea {
      width: 100%; margin-top: 32px; padding: 12px; border-radius: 8px;
      background: #111; border: 1px solid #222; color: #e2e2e2;
      font-size: 14px; resize: vertical; min-height: 80px;
    }
    button {
      margin-top: 10px; padding: 10px 24px; border-radius: 6px;
      background: #6d28d9; border: none; color: white;
      font-size: 14px; cursor: pointer;
    }
    button:hover { background: #7c3aed; }
    #result { margin-top: 12px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>Jarvis</h1>
  <p>Voice assistant status — audio plays through laptop speakers.</p>

  <div id="rows">
    <div class="row"><span class="label">Server</span><span class="value" id="srvStatus">checking…</span></div>
    <div class="row"><span class="label">Voice ID</span><span class="value" id="voiceId">—</span></div>
    <div class="row"><span class="label">Playing</span><span class="value" id="playing">—</span></div>
  </div>

  <textarea id="txt" placeholder="Type something to test the voice…"></textarea>
  <br>
  <button onclick="speak()">Speak</button>
  <p id="result"></p>

  <script>
    async function poll() {
      try {
        const r = await fetch('/status').then(r => r.json());
        document.getElementById('srvStatus').textContent = 'Online';
        document.getElementById('srvStatus').className = 'value ok';
        document.getElementById('voiceId').textContent = r.voiceId;
        document.getElementById('playing').textContent = r.playing ? 'Yes' : 'Idle';
        document.getElementById('playing').className = r.playing ? 'value busy' : 'value';
      } catch {
        document.getElementById('srvStatus').textContent = 'Offline';
        document.getElementById('srvStatus').className = 'value';
      }
    }

    async function speak() {
      const text = document.getElementById('txt').value.trim();
      if (!text) return;
      document.getElementById('result').textContent = 'Sending…';
      try {
        const r = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, source: 'status-page' })
        }).then(r => r.json());
        document.getElementById('result').textContent = r.ok ? 'Playing on laptop speakers.' : JSON.stringify(r);
      } catch (e) {
        document.getElementById('result').textContent = 'Error: ' + e.message;
      }
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
