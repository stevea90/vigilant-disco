<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Claude Voice</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #7c3aed;
      --accent-glow: #7c3aed44;
      --text: #e2e2e2;
      --muted: #888;
      --green: #22c55e;
      --blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.connected  { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.speaking   { background: var(--blue);  box-shadow: 0 0 12px var(--blue); animation: pulse 0.8s infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.4); opacity: 0.7; }
    }

    .orb-wrap {
      width: 160px; height: 160px;
      display: flex; align-items: center; justify-content: center;
    }

    .orb {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #9f67fa, var(--accent), #3b0f8c);
      box-shadow: 0 0 40px var(--accent-glow);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .orb.speaking {
      animation: orbPulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes orbPulse {
      from { transform: scale(1);    box-shadow: 0 0 40px var(--accent-glow); }
      to   { transform: scale(1.12); box-shadow: 0 0 70px #7c3aed88; }
    }

    .orb svg { opacity: 0.9; }

    .status-label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .transcript-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .transcript-card h2 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    #transcript {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      min-height: 60px;
      word-break: break-word;
    }

    .controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #222; }
    button:active { background: #2a2a2a; }

    #muteBtn.muted { color: #ef4444; border-color: #ef4444; }

    audio { display: none; }

    .history {
      width: 100%;
      max-width: 420px;
    }

    .history h2 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <h1>Claude Voice</h1>
    <div class="dot" id="dot" title="Connection status"></div>
  </header>

  <div class="orb-wrap">
    <div class="orb" id="orb">
      <!-- Speaker icon -->
      <svg width="40" height="40" fill="white" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06C18.01 19.86 21 16.28 21 12c0-4.28-2.99-7.86-7-8.77z"/>
      </svg>
    </div>
  </div>

  <p class="status-label" id="statusLabel">Waiting for Claude</p>

  <div class="transcript-card">
    <h2>Last response</h2>
    <p id="transcript">—</p>
  </div>

  <div class="controls">
    <button id="muteBtn">Mute</button>
    <button id="replayBtn" disabled>Replay</button>
  </div>

  <audio id="player"></audio>

  <div class="history">
    <h2>History</h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const dot = document.getElementById('dot');
    const orb = document.getElementById('orb');
    const statusLabel = document.getElementById('statusLabel');
    const transcript = document.getElementById('transcript');
    const player = document.getElementById('player');
    const muteBtn = document.getElementById('muteBtn');
    const replayBtn = document.getElementById('replayBtn');
    const historyList = document.getElementById('historyList');

    let muted = false;
    let lastAudio = null;
    const history = [];

    // ── SSE connection ────────────────────────────────────────────────────────
    function connect() {
      const es = new EventSource('/events');

      es.addEventListener('speak', e => {
        const { audio, text } = JSON.parse(e.data);
        lastAudio = audio;
        history.unshift({ audio, text });
        if (history.length > 10) history.pop();

        transcript.textContent = text;
        replayBtn.disabled = false;
        renderHistory();

        if (!muted) playAudio(audio);
      });

      es.onopen = () => {
        dot.className = 'dot connected';
        statusLabel.textContent = 'Connected — waiting for Claude';
      };

      es.onerror = () => {
        dot.className = 'dot';
        statusLabel.textContent = 'Reconnecting…';
        es.close();
        setTimeout(connect, 3000);
      };
    }

    connect();

    // ── Audio playback ────────────────────────────────────────────────────────
    function playAudio(src) {
      player.src = src;
      player.play().catch(() => {
        // Autoplay blocked — user must tap orb to unlock
        statusLabel.textContent = 'Tap orb to hear response';
        orb.onclick = () => { player.play(); orb.onclick = null; };
      });

      orb.classList.add('speaking');
      dot.className = 'dot speaking';
      statusLabel.textContent = 'Speaking…';

      player.onended = () => {
        orb.classList.remove('speaking');
        dot.className = 'dot connected';
        statusLabel.textContent = 'Connected — waiting for Claude';
      };
    }

    // ── Controls ──────────────────────────────────────────────────────────────
    muteBtn.onclick = () => {
      muted = !muted;
      muteBtn.textContent = muted ? 'Unmute' : 'Mute';
      muteBtn.className = muted ? 'muted' : '';
      if (muted) { player.pause(); orb.classList.remove('speaking'); }
    };

    replayBtn.onclick = () => { if (lastAudio) playAudio(lastAudio); };

    // ── History ───────────────────────────────────────────────────────────────
    function renderHistory() {
      historyList.innerHTML = '';
      history.forEach(({ audio, text }, i) => {
        const el = document.createElement('div');
        el.className = 'history-item';
        el.textContent = text;
        el.title = text;
        el.onclick = () => playAudio(audio);
        historyList.appendChild(el);
      });
    }
  </script>
</body>
</html>
