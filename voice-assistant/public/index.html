<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: #0d0d0d;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { color: #8b5cf6; font-size: 24px; letter-spacing: 3px; }
    header p  { color: #444; font-size: 12px; margin-top: 4px; }

    #statusBar { display: flex; gap: 20px; margin-bottom: 24px; font-size: 12px; color: #555; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #333; }
    .dot.green  { background: #22c55e; }
    .dot.amber  { background: #f59e0b; }
    .dot.purple { background: #8b5cf6; animation: pulse 1.2s ease-in-out infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    #micBtn {
      width: 96px; height: 96px; border-radius: 50%;
      border: 3px solid #6d28d9; background: #111;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; margin-bottom: 16px;
    }
    #micBtn:hover { border-color: #7c3aed; background: #1a1a2e; }
    #micBtn.listening {
      border-color: #ef4444; background: #1f0a0a;
      animation: ripple 1s ease-out infinite;
    }
    #micBtn.processing { border-color: #f59e0b; background: #1a1400; cursor: default; }
    #micBtn.speaking   { border-color: #22c55e; background: #0a1a0a; cursor: default; }

    @keyframes ripple {
      0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      100% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
    }

    #micIcon { font-size: 36px; user-select: none; }
    #stateLabel { font-size: 13px; color: #555; margin-bottom: 28px; height: 18px; text-align: center; }

    #conversation {
      width: 100%; max-width: 560px;
      display: flex; flex-direction: column; gap: 12px;
      max-height: 420px; overflow-y: auto; padding-right: 4px;
    }
    #conversation::-webkit-scrollbar { width: 4px; }
    #conversation::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    .bubble {
      padding: 10px 14px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; max-width: 88%;
    }
    .bubble.user   { background: #1e1433; color: #c4b5fd; align-self: flex-end; border-bottom-right-radius: 3px; }
    .bubble.jarvis { background: #111; color: #e2e2e2; align-self: flex-start; border: 1px solid #1e1e1e; border-bottom-left-radius: 3px; }
    .bubble .label { font-size: 10px; color: #444; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

    /* Blinking cursor while streaming */
    .bubble.streaming .body::after {
      content: '▌';
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #resetBtn {
      margin-top: 20px; padding: 7px 18px; border-radius: 6px;
      background: transparent; border: 1px solid #2a2a2a; color: #555;
      font-size: 12px; cursor: pointer;
    }
    #resetBtn:hover { border-color: #444; color: #888; }

    #noSpeech {
      display: none; color: #ef4444; font-size: 13px;
      max-width: 400px; text-align: center; line-height: 1.5; margin-top: 12px;
    }
    #textFallback { display: none; width: 100%; max-width: 560px; margin-top: 16px; gap: 8px; }
    #textFallback input {
      flex: 1; padding: 10px 14px; border-radius: 8px;
      background: #111; border: 1px solid #222; color: #e2e2e2;
      font-size: 14px; outline: none;
    }
    #textFallback input:focus { border-color: #6d28d9; }
    #textFallback button {
      padding: 10px 18px; border-radius: 8px;
      background: #6d28d9; border: none; color: white; font-size: 14px; cursor: pointer;
    }
    #textFallback button:hover { background: #7c3aed; }
  </style>
</head>
<body>

  <header>
    <h1>J A R V I S</h1>
    <p>Voice assistant — audio plays through laptop speakers</p>
  </header>

  <div id="statusBar">
    <span><span class="dot" id="srvDot"></span><span id="srvLabel">checking…</span></span>
    <span><span class="dot" id="chatDot"></span>Claude</span>
    <span><span class="dot" id="playDot"></span><span id="playLabel">idle</span></span>
  </div>

  <button id="micBtn" title="Click to speak">
    <span id="micIcon">🎤</span>
  </button>
  <div id="stateLabel">Click the mic to speak to Jarvis</div>

  <p id="noSpeech">
    Your browser doesn't support the Web Speech API.<br>
    Please use Chrome or Edge on desktop for voice input.<br><br>
    You can still type below.
  </p>
  <div id="textFallback">
    <input type="text" id="textInput" placeholder="Type a message…">
    <button onclick="sendText()">Send</button>
  </div>

  <div id="conversation"></div>
  <button id="resetBtn" onclick="resetConversation()">Clear conversation</button>

  <script>
    // ── State ─────────────────────────────────────────────────────────────────
    const STATES = { IDLE: 'idle', LISTENING: 'listening', PROCESSING: 'processing', SPEAKING: 'speaking' };
    let state = STATES.IDLE;
    let recognition = null;

    const micBtn     = document.getElementById('micBtn');
    const micIcon    = document.getElementById('micIcon');
    const stateLabel = document.getElementById('stateLabel');
    const convEl     = document.getElementById('conversation');

    // ── Web Speech API ────────────────────────────────────────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = e => {
        const transcript = e.results[0][0].transcript.trim();
        if (transcript) sendVoice(transcript);
        else setState(STATES.IDLE);
      };

      recognition.onerror = e => {
        console.warn('[speech]', e.error);
        setState(STATES.IDLE);
        setLabel(e.error === 'no-speech' ? 'Nothing heard — try again' : 'Mic error: ' + e.error);
      };

      recognition.onend = () => {
        if (state === STATES.LISTENING) setState(STATES.IDLE);
      };
    } else {
      document.getElementById('noSpeech').style.display = 'block';
      document.getElementById('textFallback').style.display = 'flex';
      micBtn.style.display = 'none';
      stateLabel.style.display = 'none';
    }

    micBtn.addEventListener('click', () => {
      if (state === STATES.LISTENING) { recognition.stop(); setState(STATES.IDLE); }
      else if (state === STATES.IDLE)  { recognition.start(); setState(STATES.LISTENING); }
    });

    // ── Send to /chat — reads SSE stream for real-time text ───────────────────
    async function sendVoice(text) {
      addBubble('user', text);
      setState(STATES.PROCESSING);

      let jarvisBubble = null;
      let fullText = '';

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          addBubble('jarvis', 'Error: ' + (err.error || response.statusText));
          setState(STATES.IDLE);
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let lineBuf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          lineBuf += decoder.decode(value, { stream: true });

          // Process all complete lines
          let nl;
          while ((nl = lineBuf.indexOf('\n')) !== -1) {
            const line = lineBuf.slice(0, nl);
            lineBuf = lineBuf.slice(nl + 1);

            if (!line.startsWith('data: ')) continue;
            const data = JSON.parse(line.slice(6));

            if (data.token) {
              fullText += data.token;
              if (!jarvisBubble) {
                jarvisBubble = addStreamingBubble();
                setState(STATES.SPEAKING);
              }
              updateStreamingBubble(jarvisBubble, fullText);
            }
            if (data.done) {
              finalizeStreamingBubble(jarvisBubble);
              setState(STATES.IDLE);
            }
            if (data.error) {
              addBubble('jarvis', 'Error: ' + data.error);
              setState(STATES.IDLE);
            }
          }
        }
      } catch (err) {
        addBubble('jarvis', 'Could not reach Jarvis server.');
        setState(STATES.IDLE);
      }
    }

    // ── Text fallback ─────────────────────────────────────────────────────────
    function sendText() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendVoice(text);
    }
    document.getElementById('textInput')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendText();
    });

    // ── Reset ─────────────────────────────────────────────────────────────────
    async function resetConversation() {
      await fetch('/chat/reset', { method: 'POST' });
      convEl.innerHTML = '';
    }

    // ── UI helpers ────────────────────────────────────────────────────────────
    function setState(s) {
      state = s;
      micBtn.className = s === STATES.IDLE ? '' : s;
      const labels = {
        [STATES.IDLE]:       'Click the mic to speak to Jarvis',
        [STATES.LISTENING]:  'Listening… speak now',
        [STATES.PROCESSING]: 'Thinking…',
        [STATES.SPEAKING]:   'Speaking…'
      };
      const icons = { [STATES.IDLE]: '🎤', [STATES.LISTENING]: '🔴', [STATES.PROCESSING]: '⚙️', [STATES.SPEAKING]: '🔊' };
      setLabel(labels[s]);
      micIcon.textContent = icons[s];
    }

    function setLabel(t) { stateLabel.textContent = t; }

    function addBubble(role, text) {
      const wrap = document.createElement('div');
      wrap.className = `bubble ${role}`;
      const lbl = document.createElement('div'); lbl.className = 'label'; lbl.textContent = role === 'user' ? 'You' : 'Jarvis';
      const body = document.createElement('div'); body.className = 'body'; body.textContent = text;
      wrap.appendChild(lbl); wrap.appendChild(body);
      convEl.appendChild(wrap);
      convEl.scrollTop = convEl.scrollHeight;
      return wrap;
    }

    function addStreamingBubble() {
      return addBubble('jarvis streaming', '');
    }

    function updateStreamingBubble(bubble, text) {
      bubble.querySelector('.body').textContent = text;
      convEl.scrollTop = convEl.scrollHeight;
    }

    function finalizeStreamingBubble(bubble) {
      if (bubble) bubble.classList.remove('streaming');
    }

    // ── Status polling ────────────────────────────────────────────────────────
    async function poll() {
      try {
        const r = await fetch('/status').then(r => r.json());
        document.getElementById('srvDot').className    = 'dot green';
        document.getElementById('srvLabel').textContent = 'Online';
        document.getElementById('chatDot').className   = r.chatReady ? 'dot green' : 'dot amber';
        document.getElementById('playDot').className   = r.playing   ? 'dot purple' : 'dot';
        document.getElementById('playLabel').textContent = r.playing  ? 'playing' : 'idle';
      } catch {
        document.getElementById('srvDot').className    = 'dot';
        document.getElementById('srvLabel').textContent = 'Offline';
      }
    }

    poll();
    setInterval(poll, 4000);
  </script>
</body>
</html>
